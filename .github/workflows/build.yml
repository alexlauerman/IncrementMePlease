name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Same command the BApp Store runs (see BuildCommand in BappManifest.bmf).
      - name: Build extension jar
        run: gradle fatJar

      - name: Check the expected artifact was produced
        run: test -f build/libs/token-incrementor-all.jar

      - uses: actions/upload-artifact@v4
        with:
          name: token-incrementor
          path: build/libs/token-incrementor-all.jar
